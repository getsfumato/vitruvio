name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail rather than silently re-resolve if uv.lock is stale. A CI run that quietly installs different
  # versions than a developer has is a CI run whose green is worth less than it looks.
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: types (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-packages
      - run: uv run mypy packages apps

  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # The layering contract, and the rule that keeps the future MCP server and HTTP API thin.
      - run: uv run lint-imports

  skills:
    name: skills (generated reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # A stale skill reference is worse than none: an agent that trusts a flag which no longer exists spends its
      # next turn recovering from a usage error, and nothing in the output says the documentation was wrong.
      - run: uv run python -m vitruvio.cli.reference --check

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-packages
      # No optional extras: the default configuration must be fully testable without torch.
      - run: uv run pytest -m "not slow" -n auto

  bench:
    name: bench (recall and latency gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # The claim the planner rests on, checked rather than asserted: recall@10 at least the scan's, and p95 within
      # 3x of it. The tier is above the few hundred blocks at which an exhaustive scan legitimately wins -- below
      # that this would measure the scan and pass for the wrong reason.
      - run: uv run vitruvio bench --tier 800 --queries 12 --gate

  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.sh is the one thing here that no test imports and every new user runs first. shellcheck is
      # preinstalled on the runner image, and `sh -n` catches what it does not: between them, a typo in the
      # installer fails on a pull request rather than on a release nobody can install.
      - run: sh -n install.sh
      - run: shellcheck --shell=sh install.sh
      # The full download path needs a published release, so it is exercised by the smoke job in
      # release.yml. What is checkable without one is that the release workflow and the installer still
      # agree on the archive name -- they are the two halves of one contract, written in two files.
      - name: the installer and the release workflow must agree on the archive name
        run: |
          set -eu
          grep -q 'ARCHIVE="${PKG}-v${VERSION}-wheels.tar.gz"' install.sh
          grep -q 'name="vitruvio-v${VERSION}-wheels"' .github/workflows/release.yml

  no-sources:
    name: no-sources (PyPI pyboltzmann)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Proves the released-SDK path rather than assuming it. When [tool.uv.sources] carries a local path
      # override for pyboltzmann, every other job silently tests against a working copy.
      - run: uv sync --all-packages --no-sources
      - run: uv run pytest -m "not slow" -q
