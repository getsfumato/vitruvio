# The workspace root is virtual: it declares members and shared tooling, and is not itself a
# distribution. Nothing here is published, so there is no [project] table -- `uv` reads
# [tool.uv.workspace] and treats this directory as the root of the environment every member shares.
#
# Every configuration section below (ruff, mypy, pytest, coverage, commitizen, semantic-release) is
# deliberately declared once, at the root, rather than per member. Nine packages that lint by nine
# slightly different rules is nine ways to disagree about the same code.

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
vitruvio-kernel = { workspace = true }
vitruvio-stats = { workspace = true }
vitruvio-embeddings = { workspace = true }
vitruvio-indices = { workspace = true }
vitruvio-planner = { workspace = true }
vitruvio-ingest = { workspace = true }
vitruvio-runtime = { workspace = true }
vitruvio-bench = { workspace = true }
# Local co-development against an unreleased SDK. A workspace-root source applies to every member, so
# uncommenting this and running `uv lock` switches all nine at once. CI runs one job with
# `uv sync --no-sources` so the PyPI path stays proven rather than assumed.
# pyboltzmann = { path = "../../gaussia/pyboltzmann", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    # The SDK's behavioural conformance suites are pytest classes we inherit. They are the gate that
    # says vitruvio conforms to the protocol rather than merely imports it.
    "pyboltzmann[conformance]>=0.5.0,<0.6.0",
    # Not because the default install needs it -- the API providers are behind [api] and stay there. It is here so
    # that their tests *run*, and what those tests pin is response ordering and vector width: two things that fail
    # silently and would otherwise be exercised only on a machine that happened to have the extra installed.
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "import-linter>=2.0",
    "pre-commit>=3.5.0",
    "commitizen>=4.0.0",
    "python-semantic-release>=9.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "*.md",
]

[tool.ruff.lint]
# Scoped to the linter, not to [tool.ruff]: `preview` there also switches the *formatter* to its preview style,
# which reformatted 31 files that had nothing to do with this.
preview = true
# Only preview rules named by their exact code are enabled. Without this, `preview = true` turns on every preview
# rule in every selected family at once -- which is a lint policy change, not the one ratchet that was wanted.
explicit-preview-rules = true

select = [
    "E",
    # The ratchet on the god object. Before ADR-0013 this flagged exactly two classes in the workspace:
    # BrainService at 60 public methods and the TUI's app at 29. The facade now sits just under the threshold, so a
    # domain's worth of logic landing back on it trips a lint rather than being noticed at 3000 lines.
    "PLR0904",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "ISC",
    "ICN",
    "PIE",
    "PT",
    "RET",
    "SIM",
    "TID",
    "ARG",
    "PTH",
    "PD",
    "PL",
    "TRY",
    "RUF",
]

ignore = [
    "E501",
    "PLR0913",
    "PLR0917",
    "PLR0912",
    "PLR0915",
    "PLR0911",
    "PLR2004",
    "TRY003",
    "B008",
    "ISC001",
    "EM101",
    "EM102",
    "PLC0415",
    "SIM108",
    "TRY300",
    "RUF013",
    "RUF012",
    "ARG002",
    "N806",
    "DTZ005",
    "PLW2901",
    # Turned on by `preview` alongside PLR0904, and wrong here: the character flagged is U+00B5 MICRO SIGN in
    # "µs", which is the correct symbol for a unit. The rule wants U+03BC GREEK SMALL LETTER MU, which is the
    # letter. Renaming a unit to satisfy a homoglyph check would be the lint editing the physics.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402", "RUF022"]
# Textual event handlers, not protocol operations -- ADR-0012 already fixes that the TUI holds no protocol logic.
# Exempted by name rather than by raising the threshold, so the number keeps meaning something for the service.
"**/cli/tui/app.py" = ["PLR0904"]
"tests/**/*.py" = ["ARG", "PLR2004", "S101", "N802", "N806", "PTH", "DTZ", "B007", "UP038", "SIM117", "E402", "C401"]
"**/tests/**/*.py" = ["ARG", "PLR2004", "S101", "N802", "N806", "PTH", "DTZ", "B007", "UP038", "SIM117", "E402", "C401"]

[tool.ruff.lint.pylint]
max-public-methods = 80

[tool.ruff.lint.isort]
known-first-party = ["vitruvio"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# Deliberately *not* pinning python_version. Each `types` matrix job then checks under its own interpreter, which is
# the only thing that makes three of them worth running -- pinned to 3.11 all three checked identical semantics, and
# the only difference between them was the installed dependency stubs.
#
# Which is exactly how the pin failed: on 3.13 the installed numpy ships stubs written with PEP 695 `type` statements,
# and mypy asked to reason as 3.11 rejected its own dependency's syntax. Nothing was wrong with this codebase; the
# checker had been told to disbelieve the interpreter it was running on.
#
# The reverse risk -- 3.12+ syntax passing here and failing on 3.11 -- is what the 3.11 job in the same matrix catches.
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_any_generics = false
disallow_subclassing_any = false
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
# Nine distributions share one import namespace via PEP 420. Without this, mypy walks up from
# `src/vitruvio/kernel/config.py` looking for the package root, finds no `__init__.py`, and reports
# every module twice under two different names.
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/kernel/src",
    "packages/stats/src",
    "packages/embeddings/src",
    "packages/indices/src",
    "packages/planner/src",
    "packages/ingest/src",
    "packages/runtime/src",
    "packages/bench/src",
    "apps/cli/src",
]

# Untyped or optional third-party libraries. Listed only once something actually imports them: with
# warn_unused_configs, an override for a module nobody imports is a note on every CI run. The ones still
# to come -- sentence_transformers, open_clip -- get added alongside the code that imports them.
#
# pypdfium2 and httpx sit behind extras, so they are absent from the default sync; the code that imports them
# already reports unavailability rather than crashing, and mypy must not fail a lint the runtime survives.
[[tool.mypy.overrides]]
module = ["oras.*", "snowballstemmer.*", "pyroaring.*", "keyring.*", "pypdfium2.*", "PIL.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "packages", "apps"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=vitruvio",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=75",
    "--tb=short",
    "--maxfail=5",
]
markers = [
    "slow: needs a real model, a container, or a network registry (deselect with '-m \"not slow\"')",
    "registry: needs a local OCI registry container on localhost:5000",
]
filterwarnings = [
    # Later entries take precedence, so an `ignore::` listed *before* `error` is dead and `error` is the whole
    # policy. Four such lines sat above this one -- for DeprecationWarning, PendingDeprecationWarning, SyntaxWarning
    # and pkg_resources -- and every one of them was inert; the suite has always run strict. They are gone rather
    # than reordered, because reordering would have switched warnings off across the whole suite for the first time.
    #
    # To exempt something real, add it *below* `error` and narrow it to the module that emits it. A bare
    # `ignore::DeprecationWarning` at the end silences every deprecation vitruvio's own code raises too.
    "error",
]

[tool.coverage.run]
source = ["vitruvio"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "@overload",
]
precision = 2
show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true

[tool.semantic_release]
# One version across the whole monorepo. Per-package versioning at this size buys nothing and costs a
# release-orchestration story, so every member's pyproject is bumped together.
version_toml = [
    "packages/kernel/pyproject.toml:project.version",
    "packages/stats/pyproject.toml:project.version",
    "packages/embeddings/pyproject.toml:project.version",
    "packages/indices/pyproject.toml:project.version",
    "packages/planner/pyproject.toml:project.version",
    "packages/ingest/pyproject.toml:project.version",
    "packages/runtime/pyproject.toml:project.version",
    "packages/bench/pyproject.toml:project.version",
    "apps/cli/pyproject.toml:project.version",
]
version_variables = ["packages/kernel/src/vitruvio/kernel/version.py:__version__"]
# `python -m build` cannot run here: the workspace root is virtual and has no [project] table, so there
# is nothing at the top level to build. `uv build --all-packages` builds all nine members instead, which
# is what a release has to carry -- the CLI wheel alone would be uninstallable.
#
# `uv lock` first, and not as a nicety: uv.lock records every member's version, so a bump that leaves it
# untouched makes the lock stale, and CI runs with UV_FROZEN=1. The next push would fail on the lock
# rather than on anything a person changed. semantic-release runs build_command *before* the release
# commit, so the relocked file lands in that commit via `assets` below.
#
# `rm -rf dist` because the release counts what it finds there: a leftover wheel from an earlier version
# would be bundled alongside the new ones and installed in preference to nothing at all.
build_command = "uv lock && rm -rf dist && uv build --all-packages --out-dir dist"
# Everything the bump touches that is not a version file. Without this the release commit is missing the
# lock the build just regenerated.
assets = ["uv.lock"]
commit_message = "chore(release): v{version}"
# Otherwise the release commits are authored by `semantic-release <semantic-release>`, which is not an
# email and maps to no account, so GitHub files them under an anonymous contributor of that name. This is
# the Actions bot's real identity, and the commits attribute to it.
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "b"

[tool.semantic_release.changelog]
# `update` splits the existing file on insertion_flag and writes the new section immediately below it,
# rather than regenerating the whole history on every release. Both are named explicitly because the flag
# is the load-bearing part: without that literal comment in CHANGELOG.md, semantic-release finds nothing
# to split on and writes no entry at all -- no error, no warning, just a release with no changelog. Do
# not remove the `<!-- version list -->` line from CHANGELOG.md.
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge",
]

[tool.semantic_release.changelog.default_templates]
# Named here rather than at [tool.semantic_release.changelog], where it is deprecated and slated for
# removal in v11.
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat",
    "fix",
    "docs",
    "style",
    "refactor",
    "perf",
    "test",
    "build",
    "ci",
    "chore",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
