[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitruvio-sql"
version = "0.26.1"
description = "SQL queries over a Boltzmann brain: derived tables, a read-only guard, and DuckDB"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alex Fiorenza", email = "alexfiorenza2012@gmail.com"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pyboltzmann==0.9.1",
    "vitruvio-kernel",
    # The guard. Pure Python and dependency-free: it parses the query, refuses anything that is not a read, and
    # rewrites table names onto the brain's derived tables before the engine sees a character of it.
    "sqlglot>=30.0.0",
    # The engine. A binary wheel of 10-30MB, which is why the whole distribution sits behind the `sql` extra of
    # vitruvio-runtime rather than in the default install.
    "duckdb>=1.3.0",
]

[tool.hatch.build.targets.wheel]
# PEP 420: there is no src/vitruvio/__init__.py in any member, so all nine distributions install into
# one shared `vitruvio` namespace. Adding an __init__.py here would shadow the others.
only-include = ["src/vitruvio/sql"]
# `sources` strips the src/ prefix so the wheel holds vitruvio/sql/, and -- the part that actually
# matters -- an editable install puts src/ on sys.path rather than src/vitruvio/. With `packages` instead,
# hatchling treats src/vitruvio as the source root, and `import vitruvio.sql` fails while `import sql`
# succeeds: nine distributions each claiming to be the top level of a namespace they were meant to share.
sources = ["src"]
