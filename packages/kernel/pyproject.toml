[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitruvio-kernel"
version = "0.6.5"
description = "Configuration, brain discovery, identity and errors for the vitruvio runtime"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alex Fiorenza", email = "alexfiorenza2012@gmail.com"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # Machine-wide discovery state is updated by independent CLI processes. The lock spans each complete
    # read-modify-write transaction so two terminals cannot discard one another's registrations.
    "filelock>=3.13.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyboltzmann>=0.6.0,<0.7.0",
    # Reading TOML is stdlib (tomllib); writing it is not, and `config set`, `brain use` and the
    # model-tag write-back all need to write. Pure Python, no transitive dependencies.
    "tomli-w>=1.0.0",
    # Ordering two version strings, for the update check. Declared rather than leaned on: `packaging` is
    # present in a development environment by accident of the toolchain and nothing in this graph requires
    # it, so an installed vitruvio could be without it. The alternative was a hand-rolled comparator, and
    # the one written here read `0.6.0b1` as `0.6.0` -- offering a prerelease as an upgrade over its own
    # release. Reimplementing PEP 440 to save a pure-Python dependency is not a trade worth making.
    "packaging>=23.0",
]

[tool.hatch.build.targets.wheel]
# PEP 420: there is no src/vitruvio/__init__.py in any member, so all nine distributions install into
# one shared `vitruvio` namespace. Adding an __init__.py here would shadow the others.
only-include = ["src/vitruvio/kernel"]
# `sources` strips the src/ prefix so the wheel holds vitruvio/kernel/, and -- the part that actually
# matters -- an editable install puts src/ on sys.path rather than src/vitruvio/. With `packages` instead,
# hatchling treats src/vitruvio as the source root, and `import vitruvio.kernel` fails while `import kernel`
# succeeds: nine distributions each claiming to be the top level of a namespace they were meant to share.
sources = ["src"]
