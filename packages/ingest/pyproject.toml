[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitruvio-ingest"
version = "0.3.0"
description = "Normalization pipelines and candidate proposers: where an external model touches a brain"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alex Fiorenza", email = "alexfiorenza2012@gmail.com"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pyboltzmann>=0.4.1,<0.5.0",
    "vitruvio-kernel",
]

[project.optional-dependencies]
# PDF text extraction. Named `vision` rather than `pdf` because it is the same extra that carries the image
# embedder: both are "vitruvio may read something that is not text".
vision = ["pypdfium2>=4.30.0"]
# The API proposers. httpx directly, not the provider SDKs: two more dependency trees to satisfy one POST each,
# and both change their client surface between majors. There is no `html` extra -- the HTML pipeline uses
# html.parser from the standard library on purpose, because a better parser would change a view's digest on a
# dependency bump.
api = ["httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
# PEP 420: there is no src/vitruvio/__init__.py in any member, so all nine distributions install into
# one shared `vitruvio` namespace. Adding an __init__.py here would shadow the others.
only-include = ["src/vitruvio/ingest"]
# `sources` strips the src/ prefix so the wheel holds vitruvio/ingest/, and -- the part that actually
# matters -- an editable install puts src/ on sys.path rather than src/vitruvio/. With `packages` instead,
# hatchling treats src/vitruvio as the source root, and `import vitruvio.ingest` fails while `import ingest`
# succeeds: nine distributions each claiming to be the top level of a namespace they were meant to share.
sources = ["src"]
