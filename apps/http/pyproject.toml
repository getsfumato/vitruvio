[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitruvio-http"
version = "0.30.1"
description = "Stateless HTTP adapters for querying and ingesting OCI brains"
requires-python = ">=3.11"
dependencies = [
    "vitruvio-runtime",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "tomli-w>=1.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "boto3>=1.35.0",
]

[project.scripts]
vitruvio-ingest-worker = "vitruvio.http.worker:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/vitruvio/http"]
sources = ["src"]
