[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitruvio"
version = "0.6.2"
description = "The vitruvio CLI: run a Boltzmann brain from the command line"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alex Fiorenza", email = "alexfiorenza2012@gmail.com"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "vitruvio-kernel",
    "vitruvio-runtime",
    "cyclopts>=4.0.0",
    "rich>=13.7.0",
    # Textual is a hard dependency rather than an extra. `vitruvio browse` is not a side feature -- it is how a
    # person reads a brain -- and an interface that is only present when someone guessed the right extra is an
    # interface nobody finds. It costs no import time either: nothing under vitruvio.cli.tui is imported until
    # `browse` runs, so `config show` still starts in tens of milliseconds. The wheel cost is small and pure
    # Python (rich, markdown-it-py, platformdirs), unlike torch, which is why *that* is an extra and this is not.
    "textual>=1.0.0",
]

[project.optional-dependencies]
local = ["vitruvio-embeddings[local-text]"]
vision = ["vitruvio-embeddings[vision]", "vitruvio-ingest[vision]"]
# One extra for both halves of "talk to a provider over HTTP": the API embedders and the API proposers. They use the
# same client and the same key conventions, so splitting them would only make one of the two silently unavailable.
api = ["vitruvio-embeddings[api]", "vitruvio-ingest[api]"]
keyring = ["vitruvio-runtime[keyring]"]
# The benchmark harness and its corpus generator. An extra rather than a dependency because it is a development
# tool: it generates brains, measures them, and nothing in a published install needs it. `vitruvio bench` reports
# this extra by name when it is absent, rather than failing on an import nobody asked for.
bench = ["vitruvio-bench"]
all = ["vitruvio[local]", "vitruvio[vision]", "vitruvio[api]", "vitruvio[keyring]", "vitruvio[bench]"]

[project.scripts]
vitruvio = "vitruvio.cli.main:main"

[tool.hatch.build.targets.wheel]
# PEP 420: there is no src/vitruvio/__init__.py in any member, so all nine distributions install into
# one shared `vitruvio` namespace. Adding an __init__.py here would shadow the others.
only-include = ["src/vitruvio/cli"]
# `sources` strips the src/ prefix so the wheel holds vitruvio/cli/, and -- the part that actually
# matters -- an editable install puts src/ on sys.path rather than src/vitruvio/. With `packages` instead,
# hatchling treats src/vitruvio as the source root, and `import vitruvio.cli` fails while `import cli`
# succeeds: nine distributions each claiming to be the top level of a namespace they were meant to share.
sources = ["src"]
# src/vitruvio/cli/skills is a symlink to skills/ at the repository root, where they are authored: one copy under
# version control, and both the sdist and the wheel carry the contents. `only-include` above covers the directory,
# but hatchling excludes non-Python files from a package directory unless they are named -- and a `skills install`
# that installs nothing is a silent failure.
artifacts = ["src/vitruvio/cli/skills/**/*.md"]
