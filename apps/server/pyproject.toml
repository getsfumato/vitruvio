[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitruvio-server"
version = "0.32.1"
description = "Vitruvio Server: query and ingest APIs over OCI-backed brains"
requires-python = ">=3.11"
dependencies = [
    "vitruvio-runtime",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "tomli-w>=1.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "boto3>=1.35.0",
]

[project.scripts]
vitruvio-server = "vitruvio.server.main:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/vitruvio/server"]
sources = ["src"]
